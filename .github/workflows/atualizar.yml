
name: Atualizar noticias LG Cinema

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar noticias
        run: python atualizar_noticias.py

      - name: Salvar noticias atualizadas
        run: |
          git config user.name "LG Cinema Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-news-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizacao automatica das noticias"
            git push
          fi
